name: Release

# 打 tag（v1.2.3）触发构建并发布 Release APK。
# 也可手动触发：Actions → Release → Run workflow，填一个版本号。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不带 v），例如 1.0.0'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------------------------------------------- 版本 --
      - name: Resolve version from tag
        shell: pwsh
        run: |
          $raw = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { '${{ inputs.version }}' }
          $ver = $raw -replace '^v', ''
          if (-not $ver) { throw 'No version. Push a vX.Y.Z tag or provide the workflow input.' }
          if ($ver -notmatch '^(\d+)\.(\d+)\.(\d+)$') { throw "Version must look like 1.2.3 (got '$ver')" }
          $code = [int]$Matches[1] * 10000 + [int]$Matches[2] * 100 + [int]$Matches[3]

          $manifestPath = 'app/AndroidManifest.xml'
          $xml = Get-Content $manifestPath -Raw
          $xml = $xml -replace 'android:versionCode="\d+"', "android:versionCode=`"$code`""
          $xml = $xml -replace 'android:versionName="[^"]*"', "android:versionName=`"$ver`""
          Set-Content $manifestPath $xml -Encoding utf8

          "VERSION=$ver"       | Out-File $env:GITHUB_ENV -Append
          "VERSION_CODE=$code" | Out-File $env:GITHUB_ENV -Append
          Write-Host "building v$ver (versionCode $code)"
          Select-String -Path $manifestPath -Pattern 'versionCode|versionName'

      # ------------------------------------------------------------- toolchain --
      # build.ps1 通过 JAVA_HOME 自动发现 JDK；runners 已自带 Android SDK。
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # --------------------------------------------------------------- signing --
      - name: Prepare signing key
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if ($env:KEYSTORE_BASE64) {
            $path = Join-Path $env:RUNNER_TEMP 'release.keystore'
            [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:KEYSTORE_BASE64))
            "KEYSTORE_PATH=$path" | Out-File $env:GITHUB_ENV -Append
            Write-Host 'using repository signing key'
          } else {
            Write-Warning 'KEYSTORE_BASE64 未配置：本次将使用临时生成的密钥签名，产物无法覆盖升级已安装的旧版本。'
          }

      - name: Toolchain diagnostics
        shell: pwsh
        run: |
          Write-Host "JAVA_HOME        : $env:JAVA_HOME"
          Write-Host "javac on PATH    : $((Get-Command javac -ErrorAction SilentlyContinue).Source)"
          if ($env:JAVA_HOME) {
            $j = Join-Path $env:JAVA_HOME 'bin\javac.exe'
            Write-Host "javac in JAVA_HOME: $j  exists=$(Test-Path -LiteralPath $j)"
          }
          Write-Host "ANDROID_HOME     : $env:ANDROID_HOME"
          Write-Host "ANDROID_SDK_ROOT : $env:ANDROID_SDK_ROOT"
          & java -version 2>&1 | ForEach-Object { Write-Host "java  : $_" }

      # ----------------------------------------------------------------- build --
      - name: Build
        shell: pwsh
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          # KEYSTORE_PATH 由 Prepare signing key 写入 GITHUB_ENV，后续步骤作为进程环境变量可见。
          # 不能用 ${{ env.KEYSTORE_PATH }} 传递：env 上下文不包含运行期写入的变量。
          $p = @{}
          if ($env:JAVA_HOME) { $p.JdkHome = $env:JAVA_HOME }
          if ($env:KEYSTORE_PATH) {
            $p.Keystore = $env:KEYSTORE_PATH
            if ($env:KEYSTORE_PASS) { $p.KeystorePass = $env:KEYSTORE_PASS }
            if ($env:KEY_ALIAS)     { $p.KeyAlias     = $env:KEY_ALIAS }
            if ($env:KEY_PASS)      { $p.KeyPass      = $env:KEY_PASS }
          }
          & ./build.ps1 @p

      - name: Collect artifacts
        shell: pwsh
        run: |
          $apk = "build/PayPal-RASP-Guard-$env:VERSION.apk"
          if (-not (Test-Path $apk)) { throw "APK not found: $apk" }
          $sha = Get-Content "$apk.sha256"
          "SHA_LINE=$sha" | Out-File $env:GITHUB_ENV -Append
          Write-Host $sha
          "APK_PATH=$apk" | Out-File $env:GITHUB_ENV -Append

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PayPal-RASP-Guard-${{ env.VERSION }}
          path: |
            build/PayPal-RASP-Guard-*.apk
            build/PayPal-RASP-Guard-*.apk.sha256
          if-no-files-found: error

      # --------------------------------------------------------------- release --
      - name: Write release notes
        shell: pwsh
        run: |
          # 模板单独放 .github/release-notes-template.md，脚本只做占位符替换。
          # 教训：不要在 @( ) 里跨行用 '+' 拼接字符串 —— PowerShell 会把每个操作数
          # 当成独立数组元素，把链接和代码块拆成多行（v1.0.0 的说明就是这么坏的）。
          $notes = Get-Content .github/release-notes-template.md -Raw
          $notes = $notes.Replace('__VERSION__', $env:VERSION)
          $notes = $notes.Replace('__APK__', (Split-Path $env:APK_PATH -Leaf))
          $notes = $notes.Replace('__SHA__', $env:SHA_LINE)
          $notes = $notes.Replace('__REPO__', $env:GITHUB_REPOSITORY)
          $notes = $notes.Replace('__REF__', $env:GITHUB_REF_NAME)
          Set-Content -Path release-notes.md -Value $notes -NoNewline -Encoding utf8
          Write-Host '--- release-notes.md ---'
          Get-Content release-notes.md

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $title = "PayPal RASP Guard v$env:VERSION"
          $files = @($env:APK_PATH, "$env:APK_PATH.sha256")
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "release $tag exists, uploading with --clobber"
            gh release upload $tag @files --clobber
            gh release edit $tag --title $title --notes-file release-notes.md
          } else {
            gh release create $tag @files --title $title --notes-file release-notes.md
          }

